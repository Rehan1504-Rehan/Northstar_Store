{% load store_extras %}
<header class="header" id="siteHeader">
    <div class="container header-content">
        {% include 'store/includes/brand_logo.html' %}

        <form class="search-bar" id="searchForm" method="get" action="{% url 'store:product_list' %}" role="search">
            <label class="visually-hidden" for="searchInput">Search products</label>
            <input
                type="search"
                id="searchInput"
                name="q"
                value="{{ request.GET.q|default:'' }}"
                placeholder="Search for products..."
                autocomplete="off"
            >
            <button class="search-btn" id="searchBtn" type="submit">Search</button>
        </form>

        <div class="header-actions">
            {% if user.is_authenticated %}
                <a href="{% url 'store:profile' %}" class="header-link">
                    &#128100;
                    <span>Account</span>
                </a>
            {% else %}
                <a href="{% url 'store:login' %}" class="header-link">
                    &#128100;
                    <span>Account</span>
                </a>
            {% endif %}
            <a href="{% url 'store:order_list' %}" class="header-link">
                &#128230;
                <span>Orders</span>
            </a>
            <a href="{% url 'store:cart' %}" class="header-link cart-link" id="cartLink" aria-label="Cart, {{ cart_count }} item{{ cart_count|pluralize }}">
                &#128722;
                <span>Cart</span>
                <span class="cart-count" id="cartCount">{{ cart_count }}</span>
            </a>
        </div>
    </div>
</header>

<nav class="navbar header-nav" aria-label="Product categories">
    <div class="container">
        <ul class="nav-list">
            <li>
                <a href="{% url 'store:product_list' %}" class="nav-link{% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'product_list' %} active{% endif %}">All</a>
            </li>
            {% for category in nav_categories %}
                <li>
                    <a href="{{ category.get_absolute_url }}" class="nav-link{% if request.resolver_match.url_name == 'category_products' and request.resolver_match.kwargs.slug == category.slug %} active{% endif %}">{{ category.name }}</a>
                </li>
            {% endfor %}
            <li>
                <a href="{% url 'store:deals' %}" class="nav-link deals-link{% if request.resolver_match.url_name == 'deals' %} active{% endif %}">&#128293; Deals</a>
            </li>
        </ul>
    </div>
</nav>
